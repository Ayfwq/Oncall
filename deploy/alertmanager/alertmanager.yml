global:
  resolve_timeout: 5m

route:
  receiver: oncall-webhook
  group_by: [project_id, alertname, category]
  group_wait: 30s
  group_interval: 10m
  repeat_interval: 4h
  routes:
    - receiver: oncall-webhook
      matchers:
        - severity="critical"
      group_wait: 15s
      repeat_interval: 2h

receivers:
  - name: oncall-webhook
    webhook_configs:
      - url: http://api:9900/api/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: __ALERTMANAGER_WEBHOOK_TOKEN__
